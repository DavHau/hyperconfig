[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "router-cm-beryl"
version = "0.1.0"
description = "Manage IPv6 inbound-allow firewall rules on the GL.iNet Beryl (GL-MT3000) over ssh + uci"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
router-cm-beryl = "router_cm_beryl.cli:main"

[tool.setuptools]
packages = ["router_cm_beryl"]
