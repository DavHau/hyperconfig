<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploads</title>
<!-- The progress page of ./default.nix: every agent-upload status JSON
     under /uploads/status/<agent>/, refreshed every 5 s. -->
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; color: #222; }
  h1 { font-size: 1.3rem; }
  table { border-collapse: collapse; width: 100%; max-width: 70rem; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #ddd; white-space: nowrap; }
  td.bar { width: 30%; }
  .bar div { background: #eee; border-radius: 3px; height: .8rem; }
  .bar span { display: block; background: #3a7; height: 100%; border-radius: 3px; }
  .state-retrying span, .state-starting span { background: #c93; }
  #err { color: #b33; }
  small { color: #777; }
</style>
</head>
<body>
<h1>Uploads into agent workspaces</h1>
<table>
  <thead><tr><th>agent</th><th>folder</th><th>state</th><th class="bar">progress</th><th>files</th><th>data</th><th>rate</th><th>ETA</th><th>updated</th></tr></thead>
  <tbody id="rows"><tr><td colspan="9">loading…</td></tr></tbody>
</table>
<p id="err"></p>
<p><small>Refreshes every 5 s. A state of "retrying" means the link dropped; it resumes on its own every 15 s.</small></p>
<script>
const base = "/uploads/status/";
function gb(n) { return (n / 1e9).toFixed(2) + " GB"; }
function ago(t) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - t));
  return s < 90 ? s + " s ago" : Math.round(s / 60) + " min ago";
}
async function list(path) {
  const r = await fetch(base + path, { cache: "no-store", credentials: "same-origin" });
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
}
function cell(text, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  td.textContent = text;
  return td;
}
async function refresh() {
  const rows = [];
  try {
    for (const a of await list("")) {
      if (a.type !== "directory") continue;
      for (const f of await list(encodeURIComponent(a.name) + "/")) {
        if (f.type !== "file" || !f.name.endsWith(".json")) continue;
        try {
          rows.push([a.name, await list(encodeURIComponent(a.name) + "/" + encodeURIComponent(f.name))]);
        } catch (e) { /* replaced mid-read: next round */ }
      }
    }
    document.getElementById("err").textContent = "";
  } catch (e) {
    document.getElementById("err").textContent = String(e);
    return;
  }
  rows.sort((x, y) => (y[1].updated || 0) - (x[1].updated || 0));
  const body = document.getElementById("rows");
  body.replaceChildren();
  if (!rows.length) {
    const tr = document.createElement("tr");
    tr.append(cell("no uploads yet"));
    body.append(tr);
  }
  for (const [agent, s] of rows) {
    const tr = document.createElement("tr");
    const pct = Math.min(100, Math.max(0, Number(s.percent) || 0));
    const bar = cell("", "bar state-" + s.state);
    const outer = document.createElement("div");
    const inner = document.createElement("span");
    inner.style.width = pct + "%";
    outer.append(inner);
    bar.append(outer);
    bar.title = pct + "%";
    tr.append(
      cell(agent), cell(s.name), cell(s.state), bar,
      cell(s.files_done + " / " + s.files_total),
      cell(gb(s.bytes_done) + " / " + gb(s.bytes_total) + " (" + pct + "%)"),
      cell(s.rate || ""), cell(s.eta || ""), cell(ago(s.updated)),
    );
    body.append(tr);
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
